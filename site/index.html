<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores de Gestión GDD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root" id="app">
  <header class="topbar">
    <div class="topbar-title">
      <h1>Indicadores de Gestión GDD</h1>
      <p id="updated-at" class="muted">Cargando datos…</p>
    </div>
    <nav class="page-nav" aria-label="Páginas">
      <a class="page-nav-link active" href="index.html">Tabla completa</a>
      <a class="page-nav-link" href="mi-vista.html">Mi vista</a>
    </nav>
    <div class="topbar-controls">
      <button id="theme-toggle" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">◐</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters" id="filters-container">
      <!-- Los 4 dropdowns (Territorio/Subgerencia/Agencia/Jefatura) se arman en JS: buildFilterDropdown() -->
      <button id="clear-filters" class="icon-btn text-btn" title="Limpiar todos los filtros">Limpiar todo</button>
    </div>
    <input id="indicator-search" type="search" placeholder="Buscar indicador…" aria-label="Buscar indicador">
  </div>
  <div class="active-filters" id="active-filters" aria-live="polite"></div>
  <div class="legend-bar">
    <span class="legend-item"><span class="status-dot good"></span> ✓ Cumple</span>
    <span class="legend-item"><span class="status-dot warning"></span> ! Alerta</span>
    <span class="legend-item"><span class="status-dot critical"></span> ✕ Bajo meta</span>
    <span class="legend-item"><span class="status-dot neutral"></span> Sin meta / sin dato</span>
  </div>

  <main id="table-wrap" class="table-wrap">
    <p class="muted" id="status-msg">Cargando indicadores…</p>
  </main>
</div>
<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
