<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores de Gestión GDD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root" id="app">
  <header class="topbar">
    <div class="topbar-title">
      <h1>Indicadores de Gestión GDD</h1>
      <p id="updated-at" class="muted">Cargando datos…</p>
    </div>
    <div class="topbar-controls">
      <div class="view-toggle" role="tablist" aria-label="Vista">
        <button class="view-btn active" data-view="weekly" role="tab" aria-selected="true">Semanal</button>
        <button class="view-btn" data-view="ytd" role="tab" aria-selected="false">Acumulado (YTD)</button>
      </div>
      <button id="theme-toggle" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">◐</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters">
      <label class="filter-field">
        <span>Territorio</span>
        <select id="filter-territorio"><option value="">Todos</option></select>
      </label>
      <label class="filter-field">
        <span>Subgerencia</span>
        <select id="filter-subgerencia"><option value="">Todas</option></select>
      </label>
      <label class="filter-field">
        <span>Agencia</span>
        <select id="filter-agencia"><option value="">Todas</option></select>
      </label>
      <label class="filter-field">
        <span>Jefatura</span>
        <input id="filter-jefatura" type="search" list="jefatura-options" placeholder="Todas" aria-label="Filtrar por jefatura">
        <datalist id="jefatura-options"></datalist>
      </label>
      <button id="clear-filters" class="icon-btn text-btn" title="Limpiar filtros">Limpiar</button>
    </div>
    <input id="indicator-search" type="search" placeholder="Buscar indicador…" aria-label="Buscar indicador">
  </div>
  <div class="legend-bar">
    <span class="legend-item"><span class="status-dot good"></span> ✓ Cumple</span>
    <span class="legend-item"><span class="status-dot warning"></span> ! Alerta</span>
    <span class="legend-item"><span class="status-dot critical"></span> ✕ Bajo meta</span>
    <span class="legend-item"><span class="status-dot neutral"></span> Sin meta / sin dato</span>
  </div>

  <main id="table-wrap" class="table-wrap">
    <p class="muted" id="status-msg">Cargando indicadores…</p>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
